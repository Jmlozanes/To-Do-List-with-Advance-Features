<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="app-container">


        <header>

            <h1>
                TaskFlow
            </h1>

            <p>
                Manage your tasks efficiently
            </p>


            <button id="themeToggle">
                🌙 Dark Mode
            </button>


        </header>



        <section class="task-form">


            <input 
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
            >



            <select id="priority">

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>


            </select>



            <input 
            type="date"
            id="dueDate"
            >



            <button id="addTask">
                Add Task
            </button>



        </section>




        <section class="search-section">


            <input 
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            >


        </section>

        <div class="filter-buttons">


<button id="allFilter">

    All

</button>



<button id="activeFilter">

    Active

</button>



<button id="completedFilter">

    Completed

</button>


</div>




        <section>


            <ul id="taskList">

            </ul>


        </section>


    </div>



<script src="script.js"></script>


</body>

</html>
